name: npm Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or v1.2.3-beta.1, got: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server-node/package-lock.json

      - name: Verify release tag matches npm package version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const tagVersion = process.env.RELEASE_VERSION;
          const packageVersion = JSON.parse(fs.readFileSync('server-node/package.json', 'utf8')).version;

          if (tagVersion !== packageVersion) {
            console.error(`Release tag v${tagVersion} does not match server-node/package.json version ${packageVersion}.`);
            process.exit(1);
          }
          NODE

      - name: Build frontend static assets
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Install server dependencies
        working-directory: server-node
        run: npm ci

      - name: Verify package contents
        working-directory: server-node
        run: npm pack --dry-run

      - name: Publish package
        working-directory: server-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
