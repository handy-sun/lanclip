name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or v1.2.3-beta.1, got: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify release tag matches server version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const tagVersion = process.env.RELEASE_VERSION;
          const packageVersion = JSON.parse(fs.readFileSync('server-node/package.json', 'utf8')).version;

          if (tagVersion !== packageVersion) {
            console.error(`Release tag v${tagVersion} does not match server-node/package.json version ${packageVersion}.`);
            process.exit(1);
          }
          NODE

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          check-latest: true
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Build frontend
        run: |
          cd client
          npm ci
          npm run build

      - name: Build executable
        run: |
          if [ $RUNNER_OS == "Windows" ]; then
            ext=".exe"
          else
            ext=""
          fi
          cd server-node
          npm ci
          npm install --no-save caxa
          npx caxa \
            --input . \
            --output "../dist/lanclip${ext}" \
            --exclude \
              ".*" \
              "config.json" \
              "package-lock.json" \
            -- \
              "{{caxa}}/node_modules/.bin/node" \
              "{{caxa}}/main.js"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: lanclip-${{ runner.os }}
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: lanclip-*
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release
          mv artifacts/lanclip-Linux/lanclip release/lanclip-linux-amd64
          mv artifacts/lanclip-Windows/lanclip.exe release/lanclip-windows-amd64.exe
          chmod +x release/lanclip-linux-amd64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: LanClip ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: ${{ steps.release.outputs.stable != 'true' }}
          files: release/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or v1.2.3-beta.1, got: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify release tag matches server version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const tagVersion = process.env.RELEASE_VERSION;
          const packageVersion = JSON.parse(fs.readFileSync('server-node/package.json', 'utf8')).version;

          if (tagVersion !== packageVersion) {
            console.error(`Release tag v${tagVersion} does not match server-node/package.json version ${packageVersion}.`);
            process.exit(1);
          }
          NODE

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lanclip
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.stable == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
